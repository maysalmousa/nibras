<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبراس | Nibras</title>
<meta name="description" content="نبراس — منصة لعرض إحصائيات ومواقع عيوب أسطح الطرق في المملكة العربية السعودية للجهات الحكومية وهيئات الطرق.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23064E3B'/%3E%3Cg transform='translate(18 16) scale(.66)' fill='%23FCD34D'%3E%3Cpath d='M3 97C10 58 42 22 94 3C62 26 34 60 24 97Z'/%3E%3Cpath d='M73 97C69 64 74 32 94 3C84 34 83 66 91 97Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"></script>
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=14">
<style type="text/tailwindcss">
@custom-variant dark (&:is(.dark *));
@theme inline{
  --font-sans:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --color-background:var(--background);--color-foreground:var(--foreground);--color-card:var(--card);
  --color-primary:var(--primary);--color-primary-foreground:var(--primary-foreground);
  --color-muted:var(--muted);--color-muted-foreground:var(--muted-foreground);
  --color-destructive:var(--destructive);--color-border:var(--border);--color-input:var(--input);--color-ring:var(--ring);
  --radius-md:calc(var(--radius) - 2px);--radius-lg:var(--radius);--radius-xl:calc(var(--radius) + 4px);
}
</style>

</head>
<body>
<div id="app" class="flex min-h-screen flex-col bg-[#F8FAFC] lg:pl-60">

  <!-- Sidebar (desktop) -->
  <aside dir="rtl" class="fixed inset-y-0 left-0 z-40 hidden w-60 flex-col border-r border-slate-200 bg-white px-3 py-4 lg:flex">
    <a href="#landing" class="flex items-center gap-2.5 px-2">
      <span class="logo-tile grid size-9 place-items-center rounded-lg bg-[#064E3B] text-amber-300 shadow-sm"></span>
      <span class="leading-tight"><span class="block text-lg font-bold text-slate-900" data-t="brand"></span><span class="block text-[11px] text-slate-500" data-t="brandSub"></span></span>
    </a>
    <nav class="mt-6 flex flex-col gap-1" data-nav="all"></nav>
  </aside>

  <!-- Top bar -->
  <header class="sticky top-0 z-[1000] border-b border-slate-200 bg-white/85 backdrop-blur-md">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4 sm:px-6">
      <a href="#landing" class="flex items-center gap-2.5">
        <span class="logo-tile grid size-9 place-items-center rounded-lg bg-[#064E3B] text-amber-300 shadow-sm"></span>
        <span class="leading-tight"><span class="block text-lg font-bold text-slate-900" data-t="brand"></span><span class="hidden text-[11px] text-slate-500 sm:block" data-t="brandSub"></span></span>
      </a>
      <nav class="ms-4 hidden items-center gap-0.5 xl:flex" data-nav="top"></nav>
      <div class="ms-auto flex items-center gap-2">
        <button type="button" id="soundBtn" class="inline-flex size-8 shrink-0 items-center justify-center rounded-lg border border-border bg-background transition-all outline-none hover:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50 dark:border-input dark:bg-input/30"></button>
        <button type="button" id="langBtn" class="inline-flex shrink-0 items-center justify-center gap-1 rounded-[min(var(--radius-md),12px)] border border-border bg-background px-2.5 h-7 text-[0.8rem] font-medium whitespace-nowrap transition-all outline-none select-none hover:bg-muted hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50 dark:border-input dark:bg-input/30 dark:hover:bg-input/50">
          <span data-icon="languages" class="size-4"></span><span data-t="langToggle"></span>
        </button>
        <button type="button" id="menuBtn" aria-label="menu" class="inline-flex size-8 shrink-0 items-center justify-center rounded-lg border border-transparent transition-all outline-none hover:bg-muted hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50 lg:hidden">
          <span data-icon="menu" class="size-5"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <!-- Landing -->
    <section id="landing">
      <section class="relative overflow-hidden">
                <img alt="" class="absolute inset-0 h-full w-full object-cover" src="assets/hero.webp">
        <div class="absolute inset-0 bg-[linear-gradient(135deg,rgba(6,78,59,0.94)_0%,rgba(15,23,42,0.86)_100%)]"></div>
        <div class="relative mx-auto max-w-7xl px-4 py-20 sm:px-6 sm:py-28 lg:py-32">
          <div class="max-w-2xl rise">
            <span class="inline-flex items-center gap-2 rounded-full border border-emerald-300/30 bg-white/10 px-3 py-1 text-xs font-medium text-emerald-100"><span data-icon="shield-check" class="size-3.5"></span><span data-t="heroEyebrow"></span></span>
            <h1 class="mt-5 text-3xl font-bold leading-tight tracking-tight text-balance text-white sm:text-4xl lg:text-5xl" data-t="heroTitle"></h1>
            <p class="mt-5 text-base leading-relaxed text-emerald-50/90 sm:text-lg" data-t="heroBody"></p>
            <div class="mt-8 flex flex-wrap gap-3">
              <a href="#map" class="inline-flex h-11 shrink-0 items-center justify-center gap-1.5 rounded-lg border border-white/30 bg-white/5 px-5 text-sm font-medium whitespace-nowrap text-white transition-all outline-none select-none hover:bg-white/15 focus-visible:ring-3 focus-visible:ring-ring/50"><span data-t="viewMap"></span><span data-icon="arrow-fwd" class="size-4"></span></a>
            </div>
          </div>
        </div>
      </section>
      <section class="mx-auto max-w-7xl px-4 py-14 sm:px-6 sm:py-20">
        <h2 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl" data-t="pillarsTitle"></h2>
        <p class="mt-2 text-sm text-slate-500" data-t="scopeNote"></p>
        <div class="mt-8 grid gap-5 md:grid-cols-2">
          <div class="rise" style="animation-delay:.05s"><a href="#map" class="group block h-full rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition-[border-color,box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md">
            <span class="grid size-11 place-items-center rounded-lg bg-emerald-50 text-emerald-700"><span data-icon="map" class="size-5"></span></span>
            <h3 class="mt-4 text-lg font-semibold text-slate-900" data-t="pillarMapTitle"></h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-600" data-t="pillarMapBody"></p>
            <span data-icon="arrow-fwd" class="nudge mt-4 block size-4 text-emerald-700 transition-transform duration-200"></span>
          </a></div>
          <div class="rise" style="animation-delay:.15s"><a href="#defects" class="group block h-full rounded-xl border border-slate-200 bg-white p-6 shadow-sm transition-[border-color,box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:border-emerald-300 hover:shadow-md">
            <span class="grid size-11 place-items-center rounded-lg bg-emerald-50 text-emerald-700"><span data-icon="table" class="size-5"></span></span>
            <h3 class="mt-4 text-lg font-semibold text-slate-900" data-t="pillarListTitle"></h3>
            <p class="mt-2 text-sm leading-relaxed text-slate-600" data-t="pillarListBody"></p>
            <span data-icon="arrow-fwd" class="nudge mt-4 block size-4 text-emerald-700 transition-transform duration-200"></span>
          </a></div>
        </div>
      </section>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="scroll-mt-16"><div id="dashboardBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <!-- Map -->
    <section id="map" class="scroll-mt-16">
      <div class="mx-auto max-w-7xl space-y-4 px-4 py-8 sm:px-6">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div><h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl" data-t="mapTitle"></h1><p class="mt-1 text-sm text-slate-500" data-t="mapSub"></p></div>
          <div class="flex flex-wrap items-center gap-2"><div id="liveStatus" class="flex flex-wrap items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm"></div><div id="legend" class="flex flex-wrap items-center gap-3 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm shadow-sm"></div></div>
        </div>
        <div class="relative z-0 h-[calc(100vh-15rem)] min-h-[420px] overflow-hidden rounded-xl border border-slate-200 shadow-sm" dir="ltr">
          <div id="leafletMap" class="h-full w-full"></div>
        </div>
      </div>
    </section>

    <!-- Defects -->
    <section id="defects" class="scroll-mt-16">
      <div class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6">
        <div><h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl" data-t="listTitle"></h1><p class="mt-1 text-sm text-slate-500" data-t="listSub"></p></div>
        <div class="grid grid-cols-1 gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-[repeat(5,minmax(0,1fr))_auto]">
          <div class="space-y-1.5"><label for="f-type" class="flex items-center gap-2 text-xs font-medium text-slate-500 select-none" data-t="filterType"></label><select id="f-type" class="fsel"></select></div>
          <div class="space-y-1.5"><label for="f-city" class="flex items-center gap-2 text-xs font-medium text-slate-500 select-none" data-t="filterCity"></label><select id="f-city" class="fsel"></select></div>
          <div class="space-y-1.5"><label for="f-sev" class="flex items-center gap-2 text-xs font-medium text-slate-500 select-none" data-t="filterSeverity"></label><select id="f-sev" class="fsel"></select></div>
          <div class="space-y-1.5"><label for="f-from" class="flex items-center gap-2 text-xs font-medium text-slate-500 select-none" data-t="filterFrom"></label><input id="f-from" type="date" class="finput"></div>
          <div class="space-y-1.5"><label for="f-to" class="flex items-center gap-2 text-xs font-medium text-slate-500 select-none" data-t="filterTo"></label><input id="f-to" type="date" class="finput"></div>
          <div class="flex items-end"><button type="button" id="f-reset" class="inline-flex h-8 w-full shrink-0 items-center justify-center gap-1.5 rounded-lg border border-transparent px-2.5 text-sm font-medium whitespace-nowrap text-slate-600 transition-all outline-none hover:bg-muted hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50"><span data-icon="rotate" class="size-4"></span><span data-t="reset"></span></button></div>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 p-4">
            <div class="relative w-full sm:max-w-sm">
              <span data-icon="search" class="pointer-events-none absolute start-3 top-1/2 size-4 -translate-y-1/2 text-slate-400"></span>
              <input id="q" class="finput ps-9" data-tp="search" autocomplete="off">
            </div>
            <span class="text-sm text-slate-500" id="resultCount"></span>
          </div>
          <div class="relative w-full overflow-x-auto">
            <table class="w-full caption-bottom text-sm">
              <thead><tr class="border-b bg-slate-50/80" id="defHead"></tr></thead>
              <tbody id="defBody"></tbody>
            </table>
          </div>
          <div class="flex items-center justify-between gap-3 border-t border-slate-100 p-4 text-sm">
            <span class="text-slate-500" id="pageInfo"></span>
            <div class="flex gap-2">
              <button type="button" id="prevBtn" class="pbtn"><span data-icon="chev-back" class="size-4"></span><span data-t="prev"></span></button>
              <button type="button" id="nextBtn" class="pbtn"><span data-t="next"></span><span data-icon="chev-fwd" class="size-4"></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Device / Citizen / Quality / Reports / About -->
    <section id="code" class="scroll-mt-16"><div id="codeBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <section id="device" class="scroll-mt-16"><div id="deviceBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <section id="citizen" class="scroll-mt-16"><div id="citizenBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <section id="quality" class="scroll-mt-16"><div id="qualityBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <section id="reports" class="scroll-mt-16"><div id="reportsBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <section id="about" class="scroll-mt-16"><div id="aboutBody" class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6"></div></section>

    <!-- Entities -->
    <section id="entities" class="scroll-mt-16">
      <div class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6">
        <div class="flex flex-wrap items-end justify-between gap-3">
          <div><h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl" data-t="entitiesTitle"></h1><p class="mt-1 text-sm text-slate-500" data-t="entitiesSub"></p></div>
          <button type="button" id="addEnt" class="btn-primary"><span data-icon="plus" class="size-4"></span><span data-t="addEntity"></span></button>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="relative w-full overflow-x-auto">
            <table class="w-full caption-bottom text-sm">
              <thead><tr class="border-b bg-slate-50/80" id="entHead"></tr></thead>
              <tbody id="entBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section id="settings" class="scroll-mt-16">
      <div class="mx-auto max-w-7xl space-y-5 px-4 py-8 sm:px-6">
        <div><h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl" data-t="settingsTitle"></h1><p class="mt-1 text-sm text-slate-500" data-t="settingsSub"></p></div>
        <div class="divide-y divide-slate-100 rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-4 p-5">
            <div class="flex items-start gap-3"><span class="grid size-10 place-items-center rounded-lg bg-emerald-50 text-emerald-700"><span data-icon="languages" class="size-5"></span></span><div><div class="font-semibold text-slate-900" data-t="language"></div><div class="text-sm text-slate-500" data-t="languageDesc"></div></div></div>
            <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100 p-1" role="radiogroup" id="seg-lang">
              <button type="button" role="radio" data-v="ar" class="seg">العربية</button>
              <button type="button" role="radio" data-v="en" class="seg">English</button>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-4 p-5">
            <div class="flex items-start gap-3"><span class="grid size-10 place-items-center rounded-lg bg-emerald-50 text-emerald-700"><span data-icon="sun" class="size-5"></span></span><div><div class="font-semibold text-slate-900" data-t="theme"></div><div class="text-sm text-slate-500" data-t="themeDesc"></div></div></div>
            <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100 p-1" role="radiogroup" id="seg-theme">
              <button type="button" role="radio" data-v="light" class="seg"><span data-icon="sun" class="size-4"></span><span data-t="light"></span></button>
              <button type="button" role="radio" data-v="dark" class="seg"><span data-icon="moon" class="size-4"></span><span data-t="dark"></span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white"><div class="mx-auto max-w-7xl px-4 py-5 text-sm text-slate-500 sm:px-6" data-t="footer"></div></footer>
</div>

<!-- Mobile drawer -->
<div id="drawer" hidden>
  <div class="fixed inset-0 z-[1500] bg-black/10 backdrop-blur-xs" data-close></div>
  <div class="drawer-panel fixed inset-y-0 start-0 z-[1600] flex w-72 max-w-[85vw] flex-col gap-1 border-e border-slate-200 bg-white px-3 py-4 shadow-lg">
    <a href="#landing" class="flex items-center gap-2.5 px-2" data-close>
      <span class="logo-tile grid size-9 place-items-center rounded-lg bg-[#064E3B] text-amber-300 shadow-sm"></span>
      <span class="leading-tight"><span class="block text-lg font-bold text-slate-900" data-t="brand"></span><span class="block text-[11px] text-slate-500" data-t="brandSub"></span></span>
    </a>
    <nav class="mt-6 flex flex-col gap-1" data-nav="drawer"></nav>
  </div>
</div>

<!-- Dialog host -->
<div id="dlg" hidden>
  <div class="fixed inset-0 z-[2000] bg-black/10 backdrop-blur-xs" data-dclose></div>
  <div id="dlgBox" role="dialog" aria-modal="true" class="fixed top-1/2 left-1/2 z-[2001] grid w-full max-w-[calc(100%-2rem)] -translate-x-1/2 -translate-y-1/2 gap-4 rounded-xl bg-white p-4 text-sm text-slate-900 shadow-lg ring-1 ring-slate-900/10 max-h-[calc(100vh-2rem)] overflow-y-auto"></div>
</div>

<div id="bigAlert" hidden class="fixed inset-0 z-[4000]"></div>

<div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-[3000] flex w-[min(360px,calc(100%-2rem))] flex-col gap-2"></div>

<style type="text/tailwindcss">
.fsel,.finput{@apply h-8 w-full min-w-0 rounded-lg border border-input bg-transparent px-2.5 py-1 text-base transition-colors outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 md:text-sm dark:bg-input/30;}
.fsel{@apply cursor-pointer;}
.pbtn{@apply inline-flex h-7 shrink-0 items-center justify-center gap-1 rounded-[min(var(--radius-md),12px)] border border-border bg-background px-2.5 text-[0.8rem] font-medium whitespace-nowrap transition-all outline-none select-none hover:bg-muted hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 dark:border-input dark:bg-input/30;}
.btn-primary{@apply inline-flex h-8 shrink-0 items-center justify-center gap-1.5 rounded-lg border border-transparent bg-primary px-2.5 text-sm font-medium whitespace-nowrap text-primary-foreground transition-all outline-none select-none hover:bg-primary/80 focus-visible:ring-3 focus-visible:ring-ring/50;}
.btn-outline{@apply inline-flex h-8 shrink-0 items-center justify-center gap-1.5 rounded-lg border border-border bg-background px-2.5 text-sm font-medium whitespace-nowrap transition-all outline-none select-none hover:bg-muted focus-visible:ring-3 focus-visible:ring-ring/50 dark:border-input dark:bg-input/30;}
.btn-destructive{@apply inline-flex h-8 shrink-0 items-center justify-center gap-1.5 rounded-lg border border-transparent bg-destructive/10 px-2.5 text-sm font-medium whitespace-nowrap text-destructive transition-all outline-none select-none hover:bg-destructive/20 focus-visible:ring-3 focus-visible:ring-destructive/30;}
.btn-icon{@apply inline-flex size-7 shrink-0 items-center justify-center rounded-[min(var(--radius-md),12px)] border border-transparent transition-all outline-none hover:bg-muted hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50;}
.seg{@apply inline-flex items-center gap-1.5 rounded-md px-4 py-1.5 text-sm font-medium transition-[background-color,color,box-shadow] duration-200 text-slate-600 hover:text-slate-900;}
.seg[aria-checked="true"]{@apply bg-white text-primary shadow-sm hover:text-primary;}
.navlink{@apply flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium transition-colors duration-200 text-slate-600 hover:bg-slate-100 hover:text-slate-900;}
.navlink[aria-current="true"]{@apply bg-primary/10 text-primary hover:bg-primary/10 hover:text-primary;}
.toplink{@apply rounded-md px-2.5 py-1.5 text-[13px] font-medium whitespace-nowrap text-slate-600 transition-colors duration-200 hover:bg-slate-100 hover:text-slate-900;}
.toplink[aria-current="true"]{@apply bg-primary/10 text-primary;}
.th{@apply h-10 px-2 align-middle whitespace-nowrap text-start;}
.td{@apply p-2 align-middle whitespace-nowrap;}
.group:hover .nudge{transform:translateX(var(--nudge,-4px));}
</style>

<script src="js/saudi-map.js"></script>
<script src="js/pages.js?v=20"></script>
<script src="js/app.js?v=20"></script>
</body>
</html>
